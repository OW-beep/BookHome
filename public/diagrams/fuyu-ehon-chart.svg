<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" role="img" aria-label="年齢別冬の絵本の早見表：0〜2歳はおしくらまんじゅうとてぶくろ、3〜4歳はしんせつなともだちとかさじぞう、5〜6歳はゆきのひとふゆめがっしょうだんなど" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="328" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">年齢別 冬の絵本 早見表</text><rect x="24" y="54" width="352" height="66" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="81.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">0〜2歳：温かさと、くり返しのリズム</text><text x="200.0" y="101.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">『おしくらまんじゅう』『てぶくろ』</text><rect x="24" y="132" width="352" height="66" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="159.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">3〜4歳：冬の昔話と、やさしさの物語</text><text x="200.0" y="179.9" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">『しんせつなともだち』『かさじぞう』</text><rect x="24" y="210" width="352" height="66" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="237.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">5〜6歳：雪の日の体験と、春を待つ自然</text><text x="200.0" y="257.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">『ゆきのひ』『ふゆめがっしょうだん』ほか</text><text x="200" y="306" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">年齢はあくまで目安。好きなキャラクター優先でも大丈夫</text></svg>
