<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="400" height="380" role="img" aria-label="図書館で借りて試し、何度も借りた本だけを購入するという判断の流れ" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="378" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">借りる？買う？わが家の見きわめ方</text><rect x="24" y="54" width="352" height="44" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="81.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">初めて見る・気になる本</text><line x1="200" y1="98" x2="200" y2="114" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 111 L200 120 L206 111 Z" fill="#B0BBCC"/><rect x="24" y="120" width="352" height="44" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="147.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">まず図書館で借りて、試し読み</text><line x1="200" y1="164" x2="200" y2="180" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 177 L200 186 L206 177 Z" fill="#B0BBCC"/><rect x="100" y="186" width="200" height="40" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="211.4" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">繰り返し借りた？</text><path d="M150 226 L150 242 L108 242 L108 252" fill="none" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M102 244 L108 253 L114 244 Z" fill="#B0BBCC"/><path d="M250 226 L250 242 L292 242 L292 252" fill="none" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M286 244 L292 253 L298 244 Z" fill="#B0BBCC"/><text x="86" y="238" font-size="12.5" font-weight="700" fill="#6CC49A" text-anchor="middle">はい</text><text x="318" y="238" font-size="12.5" font-weight="700" fill="#6B7A94" text-anchor="middle">いいえ</text><rect x