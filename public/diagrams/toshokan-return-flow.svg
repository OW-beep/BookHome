<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 444" width="400" height="444" role="img" aria-label="図書館の本を借りてから返すまでの流れ：返却日をリマインダーに入れる、読み終わりを見通す、延長か返却か" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="442" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">返却日で慌てないための流れ</text><rect x="24" y="54" width="352" height="44" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="81.04" font-size="14" font-weight="700" fill="#33415C" text-anchor="middle">借りた日に、返却日をリマインダーへ</text><line x1="200" y1="98" x2="200" y2="112" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 109 L200 118 L206 109 Z" fill="#B0BBCC"/><rect x="24" y="118" width="352" height="44" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="145.04" font-size="14" font-weight="700" fill="#33415C" text-anchor="middle">期限の数日前に、読み終わるか見通す</text><line x1="200" y1="162" x2="200" y2="176" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 173 L200 182 L206 173 Z" fill="#B0BBCC"/><rect x="100" y="182" width="200" height="40" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="207.4" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">読み終わりそう？</text><path d="M150 222 L150 238 L108 238 L108 248" fill="none" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M102 240 L108 249 L114 240 Z" fill="#B0BBCC"/><path d="M250 222 L250 238 L292 238 L292 248" fill="none" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M286 240 L292 249 L298 240 Z" fill="#B0BBCC"/><text x="86" y="234" font-size="12.5" font-weight="700" fill="#6CC49A" text-anchor="middle">はい</text><text x="318" y="234" font-size="12.5" font-weight="700" fill="#FF8FA0" text-anchor="middle">まだ</text><rect x="24" y="254" width="168" height="70" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="108.0" y="283.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">返却する</text><text x="108.0" y="303.9" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">窓口・ブックポストなど</text><rect x="208" y="254" width="168" height="70" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="292.0" y="283.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">延長を確認</text><text x="292.0" y="303.9" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">予約が入っていなければ</text><rect x="24" y="340" width="352" height="60" rx="14" fill="#EEF1F5" stroke="#B0BBCC" stroke-width="2"/><text x="200.0" y="365.04" font-size="14" font-weight="700" fill="#33415C" text-anchor="middle">延長できない時は</text><text x="200.0" y="384.04" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">いったん返して、また予約・借り直し</text><text x="200" y="426" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">ルールは図書館ごとに違うので、案内で確認を</text></svg>