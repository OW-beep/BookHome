<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 348" width="400" height="348" role="img" aria-label="0歳、2歳、5歳それぞれの絵本の楽しみ方の違い" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="346" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">きょうだいで、本の楽しみ方はちがう</text><rect x="24" y="54" width="352" height="72" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="84.83" font-size="15.5" font-weight="700" fill="#33415C" text-anchor="middle">0歳</text><text x="200.0" y="105.33" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="middle">色や形をじっと見ている</text><rect x="24" y="138" width="352" height="72" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="168.83" font-size="15.5" font-weight="700" fill="#33415C" text-anchor="middle">2歳『だるまさんが』</text><text x="200.0" y="189.33" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="middle">同じ本を何度も。体も一緒に動く</text><rect x="24" y="222" width="352" height="72" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="252.83" font-size="15.5" font-weight="700" fill="#33415C" text-anchor="middle">5歳『おばけのてんぷら』</text><text x="200.0" y="273.33000000000004" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="middle">物語を受けとめ、言い回しを日常へ</text><text x="200" y="320" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">どれも、その子の「今」の楽しみ方です</text></svg>