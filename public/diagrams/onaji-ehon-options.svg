<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" role="img" aria-label="同じ絵本ばかり読みたがる時の3つの付き合い方：そのまま付き合う、少しだけ変える、仲間の本を混ぜる" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="328" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">同じ絵本ばかりの時の、3つの付き合い方</text><rect x="24" y="54" width="352" height="66" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="81.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">① そのまま付き合う</text><text x="200.0" y="101.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">くり返しを、安心して楽しんでいる時間</text><rect x="24" y="132" width="352" height="66" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="159.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">② 少しだけ変える</text><text x="200.0" y="179.9" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">声の調子・めくる前のひと言・子どもに言わせる</text><rect x="24" y="210" width="352" height="66" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="237.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">③ 仲間の本を混ぜる</text><text x="200.0" y="257.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">同じ作者や、似た本を1冊だけ足してみる</text><text x="200" y="306" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">無理に替えようとしなくて、大丈夫</text></svg>