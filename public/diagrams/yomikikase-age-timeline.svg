<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 348" width="400" height="348" role="img" aria-label="読み聞かせの時期ごとの様子：0〜1歳、2〜3歳、4〜6歳、何歳まで" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="346" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">読み聞かせの年齢の目安（わが家の場合）</text><line x1="44" y1="70" x2="44" y2="304" stroke="#B0BBCC" stroke-width="3" stroke-linecap="round"/><circle cx="44" cy="78" r="11" fill="#7FB8E0"/><text x="68" y="72" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">0〜1歳</text><text x="68" y="98" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="start">反応があってもなくても、続けてみる</text><circle cx="44" cy="152" r="11" fill="#FF8FA0"/><text x="68" y="146" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">2〜3歳</text><text x="68" y="172" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="start">好みがはっきり。「もう一回」とくり返す</text><circle cx="44" cy="226" r="11" fill="#FFC94A"/><text x="68" y="220" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">4〜6歳</text><text x="68" y="246" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="start">物語の奥を考え、「なんで？」と聞く</text><circle cx="44" cy="300" r="11" fill="#6CC49A"/><text x="68" y="294" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">何歳まで？</text><text x="68" y="320" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="start">期限は、無いのかもしれません</text></svg>