<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-label="バーコードが読み取れない時の確認順：上段を読む、明るさや角度、手入力、タイトル検索、手入力で登録" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="468" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">バーコードが読めない時の確認順</text><rect x="24" y="56" width="352" height="46" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="84.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">読み取っても、本が出てこない…</text><line x1="200" y1="102" x2="200" y2="114" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 111 L200 120 L206 111 Z" fill="#B0BBCC"/><rect x="24" y="120" width="352" height="46" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="148.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">上段（978か979）を読んでいる？</text><circle cx="50" cy="143" r="13" fill="#7FB8E0"/><text x="50" y="148.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="200" y1="166" x2="200" y2="178" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 175 L200 184 L206 175 Z" fill="#B0BBCC"/><rect x="24" y="184" width="352" height="46" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="212.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">明るさ・角度を変えて、もう一度</text><circle cx="50" cy="207" r="13" fill="#7FB8E0"/><text x="50" y="212.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="200" y1="230" x2="200" y2="242" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 239 L200 248 L206 239 Z" fill="#B0BBCC"/><rect x="24" y="248" width="352" height="46" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="276.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">13桁の数字を手入力してみる</text><circle cx="50" cy="271" r="13" fill="#7FB8E0"/><text x="50" y="276.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><line x1="200" y1="294" x2="200" y2="306" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 303 L200 312 L206 303 Z" fill="#B0BBCC"/><rect x="24" y="312" width="352" height="46" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="340.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">タイトルで検索してみる</text><circle cx="50" cy="335" r="13" fill="#7FB8E0"/><text x="50" y="340.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><line x1="200" y1="358" x2="200" y2="370" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 367 L200 376 L206 367 Z" fill="#B0BBCC"/><rect x="24" y="376" width="352" height="46" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="200.0" y="404.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">それでもなければ、手入力で登録</text><circle cx="50" cy="399" r="13" fill="#6CC49A"/><text x="50" y="404.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="200" y="454" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">どの段階でも、見つかったらそこで完了です</text></svg>