<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" role="img" aria-label="寝る前の読み聞かせを穏やかに終える3つの流れ：始める前に冊数を約束する、最後は短く静かな本にする、読み終えたら消灯までを決まった流れにする" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="328" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">寝る前の読み聞かせ、終わらせ方の流れ</text><rect x="24" y="54" width="352" height="66" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="81.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">① 始める前に、冊数を約束する</text><text x="200.0" y="101.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">「今日は2冊までね」を、読み始める前に</text><rect x="24" y="132" width="352" height="66" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="159.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">② 最後の1冊は、短く静かな本に</text><text x="200.0" y="179.9" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">「締めの1冊」を決めておくと、切り替えやすい</text><rect x="24" y="210" width="352" height="66" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="237.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">③ 読み終えたら、消灯まで決まった流れで</text><text x="200.0" y="257.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">「おやすみ」のあいさつまでが、ひと続きの合図</text><text x="200" y="306" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">終わりを「予測できる形」にしておくのがコツ</text></svg>
