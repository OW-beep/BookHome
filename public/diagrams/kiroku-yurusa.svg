<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 366" width="400" height="366" role="img" aria-label="読書記録が続かなかった時と、続けられるようになった今の違い" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="364" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">記録が続くようになった、3つのゆるさ</text><rect x="24" y="54" width="352" height="70" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="83.97" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">以前：毎回ちゃんと記録しなきゃ</text><text x="200.0" y="103.47" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="middle">→ しんどくなって、続かなかった</text><line x1="200" y1="124" x2="200" y2="142" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 139 L200 148 L206 139 Z" fill="#B0BBCC"/><rect x="24" y="148" width="352" height="186" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="200" y="178" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">今：続けられるやり方</text><circle cx="54" cy="222" r="13" fill="#6CC49A"/><text x="54" y="227.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="78" y="220" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="start">読めたらOK</text><text x="78" y="240" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="start">冊数だけでも十分</text><circle cx="54" cy="268" r="13" fill="#6CC49A"/><text x="54" y="273.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="78" y="266" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="start">週末にまとめて入力</text><text x="78" y="286" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="start">数日分を一気に</text><circle cx="54" cy="314" r="13" fill="#6CC49A"/><text x="54" y="319.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="78" y="312" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="start">バーコードで読み取る</text><text x="78" y="332" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="start">入力の手間を減らす</text></svg>