<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 456" width="400" height="456" role="img" aria-label="図書館の絵本を借りてから、買うか返すかを決める流れ" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="454" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">図書館の絵本、借りてからの流れ</text><rect x="24" y="54" width="352" height="44" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="81.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">図書館で借りる</text><line x1="200" y1="98" x2="200" y2="112" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 109 L200 118 L206 109 Z" fill="#B0BBCC"/><rect x="24" y="118" width="352" height="44" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="145.04" font-size="14" font-weight="700" fill="#33415C" text-anchor="middle">借りる時に、表紙（できれば奥付も）を撮る</text><line x1="200" y1="162" x2="200" y2="176" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 173 L200 182 L206 173 Z" fill="#B0BBCC"/><rect x="24" y="182" width="352" height="44" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="209.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">数日、家で子どもの様子を見る</text><rect x="24" y="258" width="150" height="52" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="99.0" y="288.86" font-size="13.5" font-weight="700" fill="#33415C" text-anchor="middle">何度も読みたがる</text><line x1="178" y1="284" x2="196" y2="284" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M193 278 L203 284 L193 290 Z" fill="#B0BBCC"/><rect x="206" y="258" width="170" height="52" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="291.0" y="279.11" font-size="13.5" font-weight="400" fill="#33415C" text-anchor="middle">買う候補に</text><text x="291.0" y="297.61" font-size="13.5" font-weight="400" fill="#6B7A94" text-anchor="middle">（持っていないか確認）</text><rect x="24" y="322" width="150" height="52" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="99.0" y="352.86" font-size="13.5" font-weight="700" fill="#33415C" text-anchor="middle">もう少し読みたい</text><line x1="178" y1="348" x2="196" y2="348" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M193 342 L203 348 L193 354 Z" fill="#B0BBCC"/><rect x="206" y="322" width="170" height="52" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="291.0" y="343.11" font-size="13.5" font-weight="400" fill="#33415C" text-anchor="middle">再度の貸出・</text><text x="291.0" y="361.61" font-size="13.5" font-weight="400" fill="#6B7A94" text-anchor="middle">予約を確認</text><rect x="24" y="386" width="150" height="52" rx="14" fill="#EEF1F5" stroke="#B0BBCC" stroke-width="2"/><text x="99.0" y="416.86" font-size="13.5" font-weight="700" fill="#33415C" text-anchor="middle">そうでもない</text><line x1="178" y1="412" x2="196" y2="412" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M193 406 L203 412 L193 418 Z" fill="#B0BBCC"/><rect x="206" y="386" width="170" height="52" rx="14" fill="#EEF1F5" stroke="#B0BBCC" stroke-width="2"/><text x="291.0" y="407.11" font-size="13.5" font-weight="400" fill="#33415C" text-anchor="middle">返して、</text><text x="291.0" y="425.61" font-size="13.5" font-weight="400" fill="#6B7A94" text-anchor="middle">次の本を探す</text><text x="200" y="246" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">子どもの様子で、選びます</text></svg>