<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 322" width="400" height="322" role="img" aria-label="家族向けの読書記録アプリを選ぶ4つのポイント：家族で共有、登録の手間、読み聞かせと一人読み、無料の範囲" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="320" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">家族向け読書記録アプリ、4つのチェック</text><rect x="24" y="54" width="352" height="54" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="75.97" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">家族で1つの本棚を共有できる？</text><text x="200.0" y="95.47" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">家族メンバーを複数登録できるか</text><circle cx="50" cy="81" r="14" fill="#7FB8E0"/><text x="50" y="86.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">✓</text><rect x="24" y="118" width="352" height="54" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="139.97" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">登録の手間は、どれくらい？</text><text x="200.0" y="159.47" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">バーコード読み取り・タイトル検索</text><circle cx="50" cy="145" r="14" fill="#FF8FA0"/><text x="50" y="150.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">✓</text><rect x="24" y="182" width="352" height="54" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="203.97" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">読み聞かせと一人読み、両方OK？</text><text x="200.0" y="223.47" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">成長に合わせて、長く使えるか</text><circle cx="50" cy="209" r="14" fill="#FFC94A"/><text x="50" y="214.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">✓</text><rect x="24" y="246" width="352" height=