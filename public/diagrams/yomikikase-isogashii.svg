<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" role="img" aria-label="忙しさに合わせた読み聞かせの3段階：余裕のある日、ふつうの日、余裕のない日" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="328" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">忙しさに合わせた、3つのやり方</text><rect x="24" y="54" width="352" height="58" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="200.0" y="77.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">余裕がある日</text><text x="200.0" y="97.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">2〜3冊。脱線も楽しむ</text><rect x="24" y="124" width="352" height="58" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="147.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">ふつうの日</text><text x="200.0" y="167.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">1冊だけ。布団に入ったタイミングで</text><rect x="24" y="194" width="352" height="94" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="214.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">余裕がない日</text><text x="200.0" y="234.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">2〜3分で読める短い絵本</text><text x="200.0" y="255.89999999999998" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">5歳の子に、めくり役・読み役をお願い</text><text x="200.0" y="276.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">どうしても無理なら「今日はお休みね」</text><text x="200" y="314" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">毎日にこだわらず、続けやすい形で</text></svg>