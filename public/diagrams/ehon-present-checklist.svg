<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 346" width="400" height="346" role="img" aria-label="絵本のプレゼントを選ぶ流れ：年齢は少し先、定番かどうか、持っているか確認、決まったら贈る" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="344" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">絵本を贈る前の、チェックの流れ</text><rect x="24" y="54" width="352" height="54" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="75.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">年齢は、少し先を選ぶ</text><text x="200.0" y="95.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">今1歳なら、1歳半〜2歳向けでも</text><circle cx="52" cy="81" r="14" fill="#7FB8E0"/><text x="52" y="86.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="200" y1="108" x2="200" y2="120" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 117 L200 126 L206 117 Z" fill="#B0BBCC"/><rect x="24" y="126" width="352" height="54" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="147.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">定番かどうか、考える</text><text x="200.0" y="167.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">定番は、持っている家庭も多いかも</text><circle cx="52" cy="153" r="14" fill="#FFC94A"/><text x="52" y="158.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="200" y1="180" x2="200" y2="192" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 189 L200 198 L206 189 Z" fill="#B0BBCC"/><rect x="24" y="198" width="352" height="54" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="219.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">持っているか、一言確認</text><text x="200.0" y="239.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">リクエストを聞いてしまうのも◎</text><circle cx="52" cy="225" r="14" fill="#FF8FA0"/><text x="52" y="230.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><line x1="200" y1="252" x2="200" y2="264" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 261 L200 270 L206 261 Z" fill="#B0BBCC"/><rect x="24" y="270" width="352" height="54" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="200.0" y="291.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">決まったら、贈る</text><text x="200.0" y="311.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">名前や日付を書ける絵本も素敵</text><circle cx="52" cy="297" r="14" fill="#6CC49A"/><text x="52" y="302.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text></svg>