<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" role="img" aria-label="読み聞かせについて分かっていること：言葉、読書や学び、親子の関係" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="328" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">読み聞かせで、分かっていること</text><rect x="24" y="54" width="352" height="58" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="77.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">言葉</text><text x="200.0" y="97.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">語彙や読む力との関連を示す研究</text><rect x="24" y="124" width="352" height="58" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="147.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">読書や学び</text><text x="200.0" y="167.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">幼児期の読み聞かせと、その後の関連</text><rect x="24" y="194" width="352" height="58" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="217.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">親子の関係</text><text x="200.0" y="237.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">愛情を込めた読み聞かせが、関係を支える</text><text x="200" y="286" font-size="11.5" font-weight="400" fill="#6B7A94" text-anchor="middle">多くは「関連」を調べた研究。原因と結果とは言い切れません</text></svg>