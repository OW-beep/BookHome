<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="400" height="340" role="img" aria-label="絵本の収納の考え方：表紙が見える場所、子どもの手が届く低い棚、別の場所に保管" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="338" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">絵本の置き場所は、3つに分けています</text><rect x="24" y="54" width="352" height="58" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="77.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">表紙が見える場所</text><text x="200.0" y="97.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">今よく読む本・お気に入りを前に</text><circle cx="52" cy="83" r="14" fill="#7FB8E0"/><text x="52" y="88.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="24" y="124" width="352" height="58" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="147.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">子どもの手が届く低い棚</text><text x="200.0" y="167.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">5歳と2歳が、自分で出し入れ</text><circle cx="52" cy="153" r="14" fill="#FF8FA0"/><text x="52" y="158.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="24" y="194" width="352" height="58" rx="14" fill="#EEF1F5" stroke="#B0BBCC" stroke-width="2"/><text x="200.0" y="217.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">別の場所に保管</text><text x="200.0" y="237.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">ふだん読まない本。入れ替えで新鮮に</text><circle cx="52" cy="223" r="14" fill="#B0BBCC"/><text x="52" y="228.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="200" y="282" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">月に1回ほど、中身を入れ替えています</text></svg>