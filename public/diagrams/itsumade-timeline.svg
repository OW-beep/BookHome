<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 348" width="400" height="348" role="img" aria-label="わが家の読み聞かせの移り変わり：生後6ヶ月、1歳すぎ、3人目が生まれて、5歳" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="346" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">わが家の読み聞かせの移り変わり</text><line x1="44" y1="70" x2="44" y2="304" stroke="#B0BBCC" stroke-width="3" stroke-linecap="round"/><circle cx="44" cy="78" r="11" fill="#7FB8E0"/><text x="68" y="72" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">生後6ヶ月</text><text x="68" y="98" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="start">寝かしつけの習慣として、はじめた</text><circle cx="44" cy="152" r="11" fill="#FF8FA0"/><text x="68" y="146" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">1歳すぎ</text><text x="68" y="172" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="start">ページごとの反応で、伝わっていたと実感</text><circle cx="44" cy="226" r="11" fill="#FFC94A"/><text x="68" y="220" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">3人目が生まれて</text><text x="68" y="246" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="start">毎日にこだわらず、できる日にする</text><circle cx="44" cy="300" r="11" fill="#6CC49A"/><text x="68" y="294" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">5歳（長女）</text><text x="68" y="320" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="start">読み聞かせが、会話のきっかけに</text></svg>