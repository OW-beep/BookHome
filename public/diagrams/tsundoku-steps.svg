<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 386" width="400" height="386" role="img" aria-label="積読との付き合い方5ステップ：一覧にする、3冊に絞る、手放す基準、買う前に確認、全部読もうとしない" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="384" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">積読と気持ちよく付き合う5ステップ</text><rect x="24" y="54" width="352" height="54" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="75.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">一覧にする</text><text x="200.0" y="95.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">何がどれだけあるか、見える化</text><circle cx="52" cy="81" r="14" fill="#7FB8E0"/><text x="52" y="86.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><rect x="24" y="118" width="352" height="54" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="139.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">今読む本を3冊に絞る</text><text x="200.0" y="159.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">残りは「待機」にして、意識から外す</text><circle cx="52" cy="145" r="14" fill="#FF8FA0"/><text x="52" y="150.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><rect x="24" y="182" width="352" height="54" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="203.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">手放す基準を決める</text><text x="200.0" y="223.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">古い・同じ内容がある・何年も開いていない</text><circle cx="52" cy="209" r="14" fill="#FFC94A"/><text x="52" y="214.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><rect x="24" y="246" width="352" height="54" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="200.0" y="267.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">買う前に確認する</text><text x="200.0" y="287.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">持ってない？図書館で借りられない？</text><circle cx="52" cy="273" r="14" fill="#6CC49A"/><text x="52" y="278.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text><rect x="24" y="310" width="352" height="54" rx="14" fill="#EEF1F5" stroke="#B0BBCC" stroke-width="2"/><text x="200.0" y="331.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">全部読もうとしない</text><text x="200.0" y="351.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">気になる章だけでも、立派な読書</text><circle cx="52" cy="337" r="14" fill="#B0BBCC"/><text x="52" y="342.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text></svg>