<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 328" width="400" height="328" role="img" aria-label="本の登録の順番：バーコード、タイトル検索、手入力" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="326" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">本の登録、見つからない時の順番</text><rect x="24" y="54" width="352" height="54" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="75.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">バーコードを読み取る</text><text x="200.0" y="95.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">裏表紙の上段（978〜）を、枠内に映す</text><circle cx="52" cy="81" r="14" fill="#7FB8E0"/><text x="52" y="86.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text><line x1="200" y1="108" x2="200" y2="132" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 129 L200 138 L206 129 Z" fill="#B0BBCC"/><text x="262" y="130" font-size="11.5" font-weight="400" fill="#6B7A94" text-anchor="start">見つからない時</text><rect x="24" y="138" width="352" height="54" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="159.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">タイトルで検索する</text><text x="200.0" y="179.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">「タイトルで検索」タブから、候補を選ぶ</text><circle cx="52" cy="165" r="14" fill="#FFC94A"/><text x="52" y="170.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text><line x1="200" y1="192" x2="200" y2="216" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 213 L200 222 L206 213 Z" fill="#B0BBCC"/><text x="262" y="214" font-size="11.5" font-weight="400" fill="#6B7A94" text-anchor="start">見つからない時</text><rect x="24" y="222" width="352" height="54" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="200.0" y="243.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">フォームに手入力する</text><text x="200.0" y="263.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">自動入力された内容も、あとで編集できる</text><circle cx="52" cy="249" r="14" fill="#6CC49A"/><text x="52" y="254.04" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="200" y="310" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">どれでも、同じ本棚に登録されます</text></svg>