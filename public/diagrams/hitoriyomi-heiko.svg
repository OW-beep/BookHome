<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" role="img" aria-label="読んでもらう本と、自分で読む本は、同時にあってよいという図" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="328" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">読み聞かせと一人読みは、並行でいい</text><rect x="24" y="54" width="168" height="150" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="108.0" y="102.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">読んでもらう本</text><text x="108.0" y="122.9" font-size="13.5" font-weight="400" fill="#6B7A94" text-anchor="middle">長い物語</text><text x="108.0" y="143.9" font-size="13.5" font-weight="400" fill="#6B7A94" text-anchor="middle">むずかしい本</text><text x="108.0" y="164.9" font-size="13.5" font-weight="400" fill="#6B7A94" text-anchor="middle">気持ちを話したい本</text><rect x="208" y="54" width="168" height="150" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="292.0" y="102.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">自分で読む本</text><text x="292.0" y="122.9" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="middle">やさしい本</text><text x="292.0" y="143.9" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="middle">何度も読んで覚えた本</text><text x="292.0" y="164.9" font-size="13" font-weight="400" fill="#6B7A94" text-anchor="middle">セリフを口にしながら</text><rect x="100" y="226" width="200" height="44" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="200.0" y="253.4" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">どちらも、あり</text><text x="200" y="300" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">きっぱり切り替えなくて大丈夫</text></svg>