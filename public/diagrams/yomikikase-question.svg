<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 424" width="400" height="424" role="img" aria-label="読み聞かせ中に質問された時の3つの対応：聞き返す、あとで話す、少し付き合う" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="422" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">読み聞かせ中に質問されたら</text><rect x="24" y="54" width="352" height="44" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="81.22" font-size="14.5" font-weight="700" fill="#33415C" text-anchor="middle">「これ、どうして？」と質問された！</text><line x1="200" y1="98" x2="200" y2="114" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 111 L200 120 L206 111 Z" fill="#B0BBCC"/><rect x="24" y="120" width="352" height="56" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="142.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">聞き返す</text><text x="200.0" y="162.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">「どう思う？」と聞いてみる</text><rect x="24" y="186" width="352" height="56" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="208.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">あとで話す</text><text x="200.0" y="228.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">「読み終わったらお話ししようね」</text><rect x="24" y="252" width="352" height="56" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="200.0" y="274.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">少しだけ付き合う</text><text x="200.0" y="294.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">気が済むまで、ちょっと脱線</text><line x1="200" y1="308" x2="200" y2="324" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M194 321 L200 330 L206 321 Z" fill="#B0BBCC"/><rect x="24" y="330" width="352" height="44" rx="14" fill="#EEF1F5" stroke="#B0BBCC" stroke-width="2"/><text x="200.0" y="356.86" font-size="13.5" font-weight="700" fill="#33415C" text-anchor="middle">気が済んだらページへ（進まなくてもOK）</text><text x="200" y="402" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">全部に答えなくて大丈夫。さえぎるより、受けとめる</text></svg>