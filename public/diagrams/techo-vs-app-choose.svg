<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 330" width="400" height="330" role="img" aria-label="読み聞かせの記録を手帳にするかアプリにするかの選び方" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="328" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">手帳とアプリ、どっち派？</text><rect x="110" y="52" width="180" height="40" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="77.4" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">自分はどっち？</text><rect x="24" y="112" width="160" height="56" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="104.0" y="144.68" font-size="13" font-weight="700" fill="#33415C" text-anchor="middle">書くこと自体が楽しい</text><line x1="188" y1="140" x2="202" y2="140" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M199 134 L209 140 L199 146 Z" fill="#B0BBCC"/><rect x="212" y="112" width="164" height="56" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="294.0" y="135.04" font-size="14" font-weight="700" fill="#33415C" text-anchor="middle">手帳・ノート</text><text x="294.0" y="154.04" font-size="11.5" font-weight="400" fill="#6B7A94" text-anchor="middle">思い出の1冊になる</text><rect x="24" y="180" width="160" height="56" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="104.0" y="212.68" font-size="13" font-weight="700" fill="#33415C" text-anchor="middle">手軽さ・集計を重視</text><line x1="188" y1="208" x2="202" y2="208" stroke="#B0BBCC" stroke-width="2.5" stroke-linecap="round"/><path d="M199 202 L209 208 L199 214 Z" fill="#B0BBCC"/><rect x="212" y="180" width="164" height="56" rx="14" fill="#E3F5EA" stroke="#6CC49A" stroke-width="2"/><text x="294.0" y="203.04" font-size="14" font-weight="700" fill="#33415C" text-anchor="middle">アプリ</text><text x="294.0" y="222.04" font-size="11