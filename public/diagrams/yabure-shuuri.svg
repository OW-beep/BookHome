<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 408" width="400" height="408" role="img" aria-label="絵本の破れ・汚れの直し方：ページの破れは透明な補修テープを裏から、背表紙の割れは製本テープで、落書きは消しゴムで軽く、水濡れは風通しのよい場所で陰干し" font-family="'Hiragino Maru Gothic ProN','Hiragino Kaku Gothic ProN','Yu Gothic','Meiryo','Noto Sans CJK JP',sans-serif"><rect x="1" y="1" width="398" height="406" rx="20" fill="#FFFBF3" stroke="#EADFC8" stroke-width="2"/><text x="24" y="36" font-size="16" font-weight="700" fill="#33415C" text-anchor="start">傷み別、絵本の直し方</text><rect x="24" y="54" width="352" height="66" rx="14" fill="#EAF4FB" stroke="#7FB8E0" stroke-width="2"/><text x="200.0" y="81.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">ページの破れ → 補修テープを裏から</text><text x="200.0" y="101.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">透明なメンディングテープが目立ちにくい</text><rect x="24" y="132" width="352" height="66" rx="14" fill="#FFF3CF" stroke="#FFC94A" stroke-width="2"/><text x="200.0" y="159.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">背表紙・のどの割れ → 製本テープ</text><text x="200.0" y="179.9" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">開きぐせのついた部分を、外側から補強</text><rect x="24" y="210" width="352" height="66" rx="14" fill="#FFE9ED" stroke="#FF8FA0" stroke-width="2"/><text x="200.0" y="237.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">落書き・軽い汚れ → 消しゴムで軽く</text><text x="200.0" y="257.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">鉛筆やクレヨンは、こすらず少しずつ</text><rect x="24" y="288" width="352" height="66" rx="14" fill="#E6F4EA" stroke="#7FB069" stroke-width="2"/><text x="200.0" y="315.9" font-size="15" font-weight="700" fill="#33415C" text-anchor="middle">水濡れ → 陰干しでゆっくり乾かす</text><text x="200.0" y="335.9" font-size="12.5" font-weight="400" fill="#6B7A94" text-anchor="middle">ページの間に紙をはさむと、波打ちを抑えやすい</text><text x="200" y="384" font-size="12" font-weight="400" fill="#6B7A94" text-anchor="middle">図書館の本は、自分で直さず窓口へ</text></svg>
